buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        // openapi-generator-gradle-plugin is only published to Maven Central up to 7.14.0;
        // newer releases are on the Gradle Plugin Portal.
        gradlePluginPortal()
    }

    dependencies {
        classpath(libs.buildscriptOpenapiGenerator)
    }
}

apply plugin: 'org.openapi.generator'
apply plugin: 'java-library'


allprojects {
    group = 'io.sirius-ms'
    version = "${siriusAPIVersion}+sirius${siriusFrontendVersion}"

    publishing {
        publications {
            mavenJava(MavenPublication) {
                pom {
                    licenses {
                        license {
                            name = 'GNU Lesser General Public License, Version 3.0'
                            url = 'https://www.gnu.org/licenses/lgpl-3.0.txt'
                        }
                    }
                }
            }
        }
        repositories {
            maven {
                name = "GitLabPublic"
                if (System.getenv("CI_JOB_TOKEN") != null) {
                    url = System.getenv('PUBLIC_REGISTRY_URL')
                    credentials(HttpHeaderCredentials) {
                        name = "Job-Token"
                        value = System.getenv("CI_JOB_TOKEN")
                    }
                    authentication {
                        header(HttpHeaderAuthentication)
                    }
                } else {
                    url = project.findProperty("io.sirius-ms.build.artifactory.public.url") as String
                    if (project.findProperty("io.sirius-ms.build.artifactory.public.username") != null
                            && project.findProperty("io.sirius-ms.build.artifactory.public.token") != null
                    ) {
                        credentials(PasswordCredentials) {
                            username = project.findProperty("io.sirius-ms.build.artifactory.public.username") as String
                            password = project.findProperty("io.sirius-ms.build.artifactory.public.token") as String
                        }
                    }else{
                        credentials(PasswordCredentials) {
                            username = project.findProperty("io.sirius-ms.build.artifactory.username") as String
                            password = project.findProperty("io.sirius-ms.build.artifactory.token") as String
                        }
                    }
                    authentication {
                        basic(BasicAuthentication)
                    }
                }
            }
        }
    }
}

dependencies {
    api project(":sirius-sdk:sirius-sdk.openapi")
    api libs.springBootStarterWebflux
    api libs.reactorNettyHttp
    api libs.luceneCore
}

openApiGenerate {
    generatorName.set("java")
    inputSpec.set("$rootDir/sirius_rest_service/openapi-spec-enums-as-ref.json")
    outputDir.set("$projectDir/sirius-sdk.openapi")
    templateDir.set("$projectDir/templates")
    apiPackage.set("io.sirius.ms.sdk.api")
    invokerPackage.set("io.sirius.ms.sdk.client")
    modelPackage.set("io.sirius.ms.sdk.model")
    groupId.set("io.sirius-ms")
    version.set(project.version.toString())
    configFile.set("$projectDir/openapi-gen-config.json")

    typeMappings.set([
            "AnyValue": "Object",
            // The error responses reference ProblemDetail. Map it onto Spring's own class instead of generating
            // a duplicate model: spring-webflux is on every consumer's classpath anyway, and SiriusClient
            // .unwrapErrorResponse() already returns org.springframework.http.ProblemDetail. Generating a second
            // type of the same name in our model package would only be something to trip over.
            "ProblemDetail": "org.springframework.http.ProblemDetail"
    ])
    importMappings.set([
            "Object": "java.lang.Object",
            "ProblemDetail": "org.springframework.http.ProblemDetail"
    ])
}

// The dependency coordinates in README.md used to be hand-typed and drifted: they still advertised
// 3.1+sirius6.3.4-SNAPSHOT while the SDK was published as 3.1+sirius6.5.4. Derive them from the very
// version the artifacts are published under so the README cannot disagree with the registry. Marker
// idiom and 'publishing' group follow the root project's 'refreshReadMe'.
tasks.register('refreshSdkReadme') {
    group = 'publishing'
    description = 'Syncs the dependency coordinates in README.md with the version the SDK is published under.'

    File readme = file('README.md')
    String coordinate = "${project.group}:${project.name}:${project.version}"
    inputs.property('coordinate', coordinate)
    outputs.file(readme)

    doLast {
        List<String> lines = readme.readLines()
        List<String> nuLines = new ArrayList<>(lines.size())
        String region = null

        lines.each { String line ->
            def begin = line =~ /^<!--begin (.+)-->$/
            if (begin.matches()) {
                region = begin.group(1)
                nuLines.add(line)
            } else if (line ==~ /^<!--end .+-->$/) {
                region = null
                nuLines.add(line)
            } else if (region == 'gradle-dependency' && line.contains('implementation "')) {
                nuLines.add(line.replaceFirst(/"[^"]*"/, "\"${coordinate}\""))
            } else if (region == 'maven-dependency' && line.contains('<version>')) {
                nuLines.add(line.replaceFirst(/<version>[^<]*<\/version>/, "<version>${project.version}</version>"))
            } else {
                nuLines.add(line)
            }
        }

        if (!nuLines.contains('<!--begin gradle-dependency-->') || !nuLines.contains('<!--begin maven-dependency-->'))
            throw new GradleException("README.md lost its dependency markers, cannot sync coordinates to ${coordinate}.")

        if (nuLines != lines) {
            readme.setText(nuLines.join('\n') + '\n', 'UTF-8')
            logger.lifecycle("Updated README.md dependency coordinates to ${coordinate}")
        }
    }
}

// Regenerating the SDK is the moment the advertised version can become wrong, so refresh the README with it.
tasks.named('openApiGenerate') {
    finalizedBy 'refreshSdkReadme'
}
