var npmDepFile = getLayout().getBuildDirectory().file("npmDeps.txt").get().asFile
var mavenDepFile = getLayout().getBuildDirectory().file("mavenDeps.txt").get().asFile
var npmAdvDir = getLayout().getBuildDirectory().dir("npmAdv").get().asFile
