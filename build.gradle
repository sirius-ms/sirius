/**
 * Date helper function, returns dates in UTC timezone
 * @return [today, now - 1 day]
 */
static def dates() {
    TimeZone.setDefault(TimeZone.getTimeZone('UTC'))
    var today = new Date()
    var yesterday = today - 1
    var published = ">${yesterday.format('Y-MM-dd')}T${yesterday.format('HH:mm:ss')}+00:00"
    return [today.format('Y-MM-dd'), published]
}

