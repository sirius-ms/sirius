#org.springframework.boot.logging.LoggingSystem=none
#logging.level.org.springframework=OFF
#logging.level.org.apache=OFF
#logging.level.root=OFF
spring.profiles.active=local
spring.main.lazy-initialization=true
# Serve requests on virtual threads (Tomcat + MVC async/SSE). Matches jjobs 0.11+, which runs all
# non-CPU jobs on virtual threads, so a request that waits on a job no longer parks a pooled OS thread.
# Requires JDK 21+; JDK 24+ (JEP 491) additionally removes carrier pinning inside synchronized blocks.
spring.threads.virtual.enabled=true

# enable/disable advanced gui controls (might need specific license)
sirius.middleware.controller.gui.advanced = true
sirius.middleware.project-space = NITRITE-NOSQL
#sirius.middleware.project-space = PROJECT-DIRECTORY
server.error.include-message=always
#logging.level.org.apache.http=INFO
#logging.level.org.apache=INFO
server.compression.enabled=false
# The comma-separated list of mime types that should be compressed
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
# Compress the response only if the response size is at least 1KB
server.compression.min-response-size=1024
server.shutdown=immediate

de.unijena.bioinf.siriusNightsky.version = 3.1
de.unijena.bioinf.siriusNightsky.sse.timeout=-1
spring.data.web.pageable.max-page-size = 2147483647
sirius.middleware.controller.unpagedLimit = 2147483647
#swagger ui config
springdoc.model-converters.pageable-converter.enabled = true
springdoc.model-converters.sort-converter.enabled = true
springdoc.api-docs.version=openapi_3_0
springdoc.remove-broken-reference-definitions=false
springdoc.pathsToMatch=/api/**,/actuator/shutdown,/actuator/health
springdoc.show-actuator=true
#springdoc.swagger-ui.supportedSubmitMethods=[]
spring.mvc.problemdetails.enabled = true
# Enable response compression runs mostly local so compression might be slower
#server.compression.enabled=true
# The comma-separated list of mime types that should be compressed
#server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
# Compress the response only if the response size is at least 1KB
#server.compression.min-response-size=1024
# shutdown enabled by default to include it in spring AOT, but disabled without -s CLI flag
management.endpoints.web.exposure.include=health,shutdown
management.endpoint.shutdown.access=unrestricted
spring.servlet.multipart.enabled = true
spring.servlet.multipart.max-file-size = -1
spring.servlet.multipart.max-request-size = -1
spring.servlet.multipart.file-size-threshold = -1
server.port=0
#
# optional controllers
#de.unijena.bioinf.ms.middleware.controller.quality.enabled=true

# Pin the Jackson semantics the published API contract relies on. Spring Boot 4 serves the REST
# layer with Jackson 3, whose defaults differ from the Jackson 2 defaults this API was designed
# against. Do not rely on Jackson defaults here.
#
# NOTE on primitives: we deliberately keep Jackson 3's strict FAIL_ON_NULL_FOR_PRIMITIVES. A
# primitive field means the value is mandatory and has no meaningful default, so a request that
# omits it must fail instead of silently getting 0/false. Properties that are documented as
# optional-with-default must live in a DTO with a no-arg constructor, so that field binding keeps
# the documented default; RequestPrimitiveContractTest enforces that pairing.
#
# enums stay name() based on the wire; Jackson 3 would use toString()
# (READ/WRITE_ENUMS_USING_TO_STRING moved to EnumFeature in Jackson 3)
spring.jackson.datatype.enum.write-enums-using-to-string=false
spring.jackson.datatype.enum.read-enums-using-to-string=false
# keep declaration order of properties, which is also what the OpenAPI spec documents
spring.jackson.mapper.sort-properties-alphabetically=false
