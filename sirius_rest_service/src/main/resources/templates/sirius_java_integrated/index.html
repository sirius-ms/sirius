<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <title>SiriusJavaIntegrated</title>
  <base href="/" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script th:inline="javascript">
    /*
    Configuration script for providing API base URL from spring boot server
    via thymeleaf templating.
    [OPTIONAL] Also runs without templating engine.
    */
    window.APP_CONFIG = {
      apiBaseUrl: /*[[${apiBaseUrl}]]*/ null
    };

    /*
    Resolve the theme before anything else loads.

    The React bundle is what normally applies the `dark` class, but it is large and only
    runs once it has been parsed. Until then the document has no background of its own and
    the window paints white, which shows as a flash on every view the desktop app opens.
    The stylesheet cannot help either: its `.dark` rule needs the class that does not exist
    yet.

    Doing it here, in a classic script that runs while the head is parsed, closes that gap.
    The background is also set inline so it does not wait for the stylesheet, and
    color-scheme keeps native scrollbars and form controls from flashing light too.
    */
    (function () {
      var isDark = new URLSearchParams(window.location.search).get('theme') === 'dark';
      var root = document.documentElement;
      if (isDark) root.classList.add('dark');
      root.style.backgroundColor = isDark ? '#3C3F41' : '#ffffff';
      root.style.colorScheme = isDark ? 'dark' : 'light';
    })();

    /*
    Define a new console, which serializes all objects to JSON.
    */
    var console=(function(oldCons) {
      return {
          log: (msg) => oldCons.log(JSON.stringify(msg, null, 4)),
          info: (msg) => oldCons.info(JSON.stringify(msg, null, 4)),
          warn: (msg) => oldCons.warn(JSON.stringify(msg, null, 4)),
          error: (msg) => oldCons.error(JSON.stringify(msg, null, 4)),
          debug: (msg) => oldCons.debug(msg)
      };
    }(window.console));
    window.console = console;
  </script>
  <script type="module" crossorigin src="/assets/index-aPDIdcUT.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-D4bXzIGS.css">
</head>
<body>
<div id="root"></div>
</body>
</html>
