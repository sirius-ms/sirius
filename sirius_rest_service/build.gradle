import groovy.json.JsonSlurper

import java.nio.file.Files

plugins {
    id "org.springdoc.openapi-gradle-plugin" version "1.9.0"
}

apply plugin: 'org.springframework.boot'
apply plugin: 'org.springframework.boot.aot'
apply plugin: 'application'

ext['jna.version'] = '5.4.0'  //force correct jna version -> springs is not compatible with ilp solver

version = siriusFrontendVersion

dependencies {

    implementation project(':sirius_cli')
    implementation project(':sirius_gui')

    //////////// configure logging ///////////////////
    implementation libs.slf4jLog4jOverSlf4j
    implementation libs.slf4jJclOverSlf4j
    implementation "org.slf4j:jul-to-slf4j"
    ////////////////////////////////////////////////////

    //////////// Spring (boot) ////////////////////////
    // Default bootJar config
    implementation "org.springframework.boot:spring-boot-starter-web"
    //thymeleaf to serve react app
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"

    //spring data for pagination and sorting
    implementation "org.springframework.data:spring-data-commons"
    implementation "org.springframework.boot:spring-boot-starter-validation"

    // expose operational information about the running application via /actuator
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    
    implementation libs.fastutil
    ////////////////////////////////////////////////////

    ////////////////////// API DOC ///////////////////
    // Generate interactive documentation from a Swagger-compliant API
    implementation libs.springdocOpenapiApi
    implementation libs.springdocOpenapiUi

    //process javadoc for swagger/openapi
    annotationProcessor libs.therapiRuntimeJavadocScribe
    implementation libs.therapiRuntimeJavadoc
    ////////////////////////////////////////////////////

    //must match minio version
    implementation libs.okhttp
    implementation "jakarta.servlet:jakarta.servlet-api"

    //todo replace with alternative to finally get rid ob guava
    implementation libs.jimfs

    implementation libs.commonsText

    implementation libs.luceneQueryparser
    implementation libs.luceneAnalysisCommon

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'


    implementation libs.secureApi

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

//todo use logback instead of java util logging! => needs support in jjobs
configurations.configureEach { conf ->
    //replaced by log4j-over-slf4j
    conf.exclude group: "log4j", module: "log4j"
    //replaced by jcl-over-slf4j
    conf.exclude group: "commons-logging", module: "commons-logging"
    conf.exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    
    SiriusPlatform.allBut(siriusTargetPlatform).stream()
            .map { it.inchiClassifier() }.flatMap { it.stream() }
            .forEach { conf.exclude(group: "io.github.dan2097", module: "jna-inchi-$it") }
    if (excludeCbcNative)
        conf.exclude(group: "de.unijena.bioinf.cbc-java", module: "cbc-java-native")

    //remove commercial solver -> given at runtime
    conf.exclude group: "com.gurobi", module: "gurobi-jar"
    conf.exclude group: "cplex", module: "cplex"
    //remove reflection scanner because we use prebuilt default config (see below)
    conf.exclude group: 'net.oneandone.reflections8', module: 'reflections8'
}

jar {
    enabled = false
}

// Let Spring Boot handle the fat jar and AOT injection automatically, its enabled just because the plugin is loaded.
bootJar {
    archiveClassifier = 'boot'
    layered {
        enabled = true
    }
}

openApi {
    apiDocsUrl.set("http://localhost:8888/v3/api-docs")
    outputDir.set(file("$projectDir"))
    waitTimeInSeconds.set(30)

    outputFileName = "openapi-spec-enums-as-ref.json"
    customBootRun {
        args = ["rest", "-s", "-p", "8888", "--api-mode", "BASIC", "--enums-as-ref"]
    }
}
forkedSpringBootRun.dependsOn(':sirius_rest_service:bootJar')


tasks.register("generateOpenApiDocsEnumsAsString") {
    description "Creates the api docs with enums treated as strings which seems to be mor compatible with some languages."
    group "openApi"
    doFirst {
        openApi {
            outputFileName = "openapi-spec-enums-as-string.json"
            customBootRun {
                args = ["rest", "-s", "-p", "8888", "--api-mode", "BASIC"]
            }
        }
    }
    finalizedBy "generateOpenApiDocs"
}

tasks.register("generateOpenApiDocsAdvancedEnumsAsString") {
    description "Creates the api docs with enums treated as strings which seems to be mor compatible with some languages."
    group "openApi"
    doFirst {
        openApi {
            outputFileName = "openapi-spec-advanced-enums-as-string.json"
            customBootRun {
                args = ["rest", "-s", "-p", "8888", "--api-mode", "ADVANCED"]
            }
        }
    }
    finalizedBy "generateOpenApiDocs"
}


tasks.register("updateUnstableExclusions") {
    group "openApi"
    description "Parses the generated OpenAPI spec and updates the exclusions lists in MiddlewareAppOptions.java"

    // Define inputs to ensure task runs when spec changes
    def specFile = file("openapi-spec-enums-as-string.json")

    // Adjust this path if your source folder structure is different
    def javaSourceFile = file("src/main/java/de/unijena/bioinf/ms/frontend/subtools/middleware/MiddlewareAppOptions.java")

    def targets = [['[EXPERIMENTAL]', 'EXPERIMENTAL_EXCLUSIONS'],
                   ['[INTERNAL]', 'INTERNAL_EXCLUSIONS'],
                   ['[DEPRECATED]', 'DEPRECATED_EXCLUSIONS']]


    // Ensure the spec exists before running this task
    dependsOn "generateOpenApiDocsEnumsAsString"

    doLast {
        if (!specFile.exists()) {
            throw new GradleException("OpenAPI spec file not found: ${specFile}")
        }
        if (!javaSourceFile.exists()) {
            throw new GradleException("Target Java source file not found: ${javaSourceFile}")
        }

        // 1. Parse the JSON Spec
        def json = new JsonSlurper().parse(specFile)

        // 2. Iterate paths and extract target endpoints
        for (def target : targets) {
            def unstablePaths = [] as Set
            def marker = target[0]
            def variable = target[1]

            json.paths.each { pathKey, methods ->
                // Check if any method in this path has the experimental tag in summary or description
                boolean isExperimental = methods.any { method, details ->
                    def summary = details.get("summary", "")
                    def description = details.get("description", "")
                    return summary.contains(marker) || description.contains(marker)
                }

                if (isExperimental) {
                    // Normalize path: replace {param} with *
                    // Equivalent to python: re.sub(r'\{[^}]+\}', '*', path)
                    def normalizedPath = pathKey.replaceAll(/\{[^}]+\}/, "*")
                    unstablePaths.add(normalizedPath)
                }
            }

            // 3. Sort and Format (Java List.of style)
            def sortedPaths = unstablePaths.sort()
            def javaListContent = sortedPaths.collect { "            \"$it\"" }.join(",\n")

            // 4. Inject into Java File
            def fileContent = javaSourceFile.text

            // Regex to find: variable = List.of( ... );
            // (?s) enables DOTALL so . matches newlines
            def regex = /(?s)(private final static List<String> ${variable} = List\.of\s*\()(.*?)(\);)/

            def matcher = (fileContent =~ regex)
            if (matcher.find()) {
                def newContent = fileContent.replaceFirst(regex, "\$1\n${javaListContent}\n    \$3")

                // Only write if changes are detected to preserve file timestamp if possible
                if (fileContent != newContent) {
                    javaSourceFile.text = newContent
                    logger.lifecycle("Successfully updated $variable in MiddlewareAppOptions.java with ${sortedPaths.size()} paths.")
                } else {
                    logger.lifecycle("MiddlewareAppOptions.java is already up to date.")
                }
            } else {
                logger.error("Could not find '$variable = List.of(...)' pattern in ${javaSourceFile.name}")
            }
        }
    }
}

// Add this line after the task definition
tasks.named("generateOpenApiDocsEnumsAsString") {
    finalizedBy "updateUnstableExclusions"
}

//###################################### Start Default values ##########################################
tasks.register('collectProfiles', Copy) {
    group = 'properties'

    // Find ALL (direct and transitive) project dependencies
    def allProjectDeps = configurations.runtimeClasspath.incoming.resolutionResult.allComponents
            .findAll { it.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier }
            .collect { project(it.id.projectPath) } // Get the Project object for each dependency
            .findAll { it != project }

    // Use the full list of project dependencies found above.
    def projectResources = allProjectDeps.collect { projectDep ->
        def resourcesDir = projectDep.sourceSets.main.output.resourcesDir
        fileTree(resourcesDir) {
            include '**/de.unijena.bioinf.ms.defaults/*.auto.config'
            include '**/de.unijena.bioinf.ms.defaults/*.class.map'
        }
    }
    //todo we might want to add config files from the current project as well if needed in the future

    // Use the full list of projects to depend on their 'processResources' tasks.
    dependsOn(allProjectDeps.collect { it.tasks.named('processResources') })

    from projectResources
    into(layout.buildDirectory.dir("tmp/profiles"))
    includeEmptyDirs = false
}

tasks.register('makeProfileTemplates') {
    group = 'properties'
    dependsOn(tasks.named('collectProfiles'))

    def input = tasks.named('collectProfiles').map {it.outputs.files.singleFile}
    inputs.dir(input)

    outputs.dir(layout.buildDirectory.dir("tmp/profiles_concat/"))

    doLast {
        delete(outputs.files.singleFile.listFiles())
        def defaultsDir = outputs.files.singleFile.toPath().resolve("de.unijena.bioinf.ms.defaults")
        Files.createDirectories(defaultsDir)

        [".auto.config", ".class.map"].each { ext ->
            defaultsDir.resolve("concat$ext").withWriter { w ->
                inputs.files.asFileTree.filter {it.getName().endsWith(ext)}.each { f ->
                    // Get a reader for the input file
                    f.withReader { r ->
                        // And write data from the input into the output
                        w << r << '\n'
                    }
                }
            }
        }
    }
}

tasks.register('checkDefaultProfile') {
    group = 'properties'
    dependsOn(tasks.named('makeProfileTemplates'))

    def input = tasks.named('makeProfileTemplates').map {it.outputs.files.singleFile}
    inputs.dir(input)

    doLast {
        def inp = inputs.files.asFileTree.matching{
            include "**/de.unijena.bioinf.ms.defaults/concat.auto.config"
        }.singleFile

        Properties defaultProfile = new Properties()
        inp.withReader("UTF8", {
                    defaultProfile.load(it)
                })

        def errorCount = 0
        logger.lifecycle(System.lineSeparator() + "Checking for NULL values in Profile...")
        defaultProfile.keys().each { e ->
            def v = defaultProfile.getProperty(e)
            if (v == null || ((String) v).isEmpty()) {
                logger.warn("${e} is NULL!")
                errorCount++
            }
        }
        if (errorCount > 0) {
            logger.error("FAILED: $errorCount NULL values found!" + System.lineSeparator())
            throw new GradleException("Error: There are NULL values in at least one auto.config files. See Warnings for more detailed information")
        }
        logger.lifecycle("DONE: No NULL values found!" + System.lineSeparator())
    }
}

tasks.named('processResources', ProcessResources) {
    dependsOn tasks.named('checkDefaultProfile')
    from(tasks.named('makeProfileTemplates'))
}

//###################################### END Default values ##########################################


/*################### JAVASCRIPT DEV MANAGEMENT ################### */

// IMPORTANT: Javascript monorepo location:
// EITHER: declare the location of of the sirius-js-monorepo in a gradle.properties file: siriusJSMonorepo=/path/to/monorepo
// OR: use the fallback (sirius-js-monorepo has the same parent dir as sirius-frontend)
def monorepoProp = providers.gradleProperty("siriusJSMonorepo")
def monorepoLocation = monorepoProp.isPresent() && !monorepoProp.get().isBlank() ? java.nio.file.Path.of(monorepoProp.get()).toAbsolutePath() : project.rootDir.toPath().parent.resolve("sirius-js-monorepo").toAbsolutePath()
def monorepoJsAppPath = "dist/apps/sirius_java_integrated/"
def jsAppPath = "src/main/resources/templates/sirius_java_integrated"

tasks.register("copyOpenApiDocsToMonorepo") {
    description "Copies the openapi docs to the sirius-js-monorepo."
    group "jsMonoRepo"
    dependsOn "generateOpenApiDocsAdvancedEnumsAsString"

    doFirst {
        copy {
            from "openapi-spec-advanced-enums-as-string.json"
            into monorepoLocation.resolve("libs/sirius-client/src")
        }
    }
}

tasks.register("copyJSAppToFrontend") {
    description "Copies the JS app from the sirius-js-monorepo."
    group "jsMonoRepo"

    doFirst {
        logger.lifecycle("Removing old sirius JS app from: '${project.projectDir.toPath().resolve(jsAppPath)}'")
        delete fileTree(project.projectDir.toPath().resolve(jsAppPath))
    }

    doLast {
        logger.lifecycle("Copy new sirius JS app from '${monorepoLocation.resolve(monorepoJsAppPath)}' into '${project.projectDir.toPath().resolve(jsAppPath)}'")
        copy {
            from fileTree(monorepoLocation.resolve(monorepoJsAppPath))
            into jsAppPath
        }
    }
}

/*################### END JAVASCRIPT DEV MANAGEMENT ################### */


// Javadoc cannot recognize lombok builder
javadoc {
    failOnError = false
    enabled = false
}
