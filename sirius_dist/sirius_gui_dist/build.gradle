import com.github.jk1.license.filter.LicenseBundleNormalizer
import com.github.jk1.license.render.InventoryMarkdownReportRenderer
import edu.sc.seis.launch4j.tasks.Launch4jLibraryTask

import java.util.stream.Collectors

plugins {
    id 'com.github.jk1.dependency-license-report' version '2.8'
}

apply plugin: "application"
apply plugin: 'org.springframework.boot'

tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

version = siriusFrontendVersion

evaluationDependsOn(':sirius_rest_service')

licenseReport {
    // Set output directory for the report data.
    // Defaults to ${project.buildDir}/reports/dependency-license.
//    outputDir = "$projectDir/build/licenses"

    // Select projects to examine for dependencies.
    // Defaults to current project and all its subprojects
//    projects = [project] + project.subprojects

    // Adjust the configurations to fetch dependencies, e.g. for Android projects. Default is 'runtimeClasspath'
//    configurations = ['implementation']
    // Use 'ALL' to dynamically resolve all configurations:
    // configurations = ALL

    // List the groups ids to exclude from dependency report. Supports regular expressions.
    // For finer granularity, see: excludes.
    excludeGroups = ['cpdetector', 'cplex', 'com.gurobi', 'de.unijena.bioinf.ms', 'de.unijena.bioinf.cbc-java', 'de.unijena.bioinf', 'de.unijena.bioinf.utils']

    // List the ids (in module:name format) to exclude from dependency report. Supports regular expressions.
    // By default excludes is empty.
//    excludes = ['moduleGroup:moduleName']

    // Don't include artifacts of project's own group into the report
    excludeOwnGroup = true

    // Set custom report renderer, implementing ReportRenderer.
    // Yes, you can write your own to support any format necessary.
//    renderers = [new XmlReportRenderer('third-party-libs.xml', 'Back-End Libraries')]
    renderers = [/*new InventoryHtmlReportRenderer(), */ new InventoryMarkdownReportRenderer('licenses.md', "SIRIUS license information", new File(rootDir, "license-overrides.txt"))]

    // Set importers to import any external dependency information, i.e. from npm.
    // Custom importer should implement DependencyDataImporter interface.
//    importers = [new XmlReportImporter('Frontend dependencies', file(frontend_libs.xml))]

    // This is for the allowed-licenses-file in checkLicense Task
    // Accepts File, URL or String path to local or remote file
//    allowedLicensesFile = new File("$projectDir/config/allowed-licenses.json")
    filters = [new LicenseBundleNormalizer(bundlePath: "$rootDir/licence-groups.json")]
}

dependencies {
    implementation project(':sirius_rest_service')
    //tests
    testImplementation project(':sirius_dist').sourceSets.test.output //needed for the TestLocal tests
}

ext {
//    mainClassNameGlobal = 'org.springframework.boot.loader.launch.JarLauncher'
    mainClassNameGlobal = 'de.unijena.bioinf.ms.middleware.SiriusMiddlewareApplication'
}

def bootJarTask = project(':sirius_rest_service').tasks.named('bootJar')

//###################################### AOT post processing #########################################

// 1. Define the extraction task
tasks.register('extractForLeyden', Exec) {
    group = 'build'
    description = 'Extracts the Spring Boot fat JAR into a flat structure for Project Leyden'

    // Ensure this runs AFTER the fat jar is fully built
    dependsOn bootJarTask

    // Grab the built jar file and define the output folder
    def jarFile = bootJarTask.get().outputs.files.singleFile
    def outputDir = layout.buildDirectory.dir("optimized-app").get().asFile
    outputs.dir(outputDir)

    // Clear the old extracted folder if it exists
    doFirst {
        delete(outputDir)
    }

    // Execute the exact extraction command
    commandLine "java",
            "-Djarmode=tools",
            "-jar", jarFile.absolutePath,
            "extract",
            "--destination", outputDir.absolutePath
}

// 2. Hook it into the standard build lifecycle
tasks.named('build') {
    dependsOn 'extractForLeyden'
}

tasks.register('trainLeydenCache') {
    group = 'build'
    description = 'Runs the extracted app in the background, polls /api/guis to ensure UI is loaded, and shuts it down via Actuator.'
    dependsOn 'extractForLeyden'
    dependsOn parent.tasks.named('extractRuntimeImage')

    doLast {
        def outputDir = getTasksByName("extractForLeyden", false).outputs.files.getFirst().singleFile
        def extractedJarName = bootJarTask.get().outputs.files.singleFile.getName()
        // todo use bunlde jdk for testrun when moved to dist package.
        def javaExe = new File(parent.tasks.getByName('extractRuntimeImage').outputs.files.singleFile, 'bin/java').absolutePath

        // Launch with the specific args to expose Actuator (-s) and start the GUI (--gui)
        def processArgs = [
                javaExe,
                "-XX:AOTCacheOutput=app.aot",
                "-Dspring.aot.enabled=true",
                "-Djxbrowser.chromium.dir=${layout.buildDirectory.dir("jxbrowser-tmp").get().asFile.absolutePath}" as String,
                "-jar", extractedJarName,
                "rest", "-s", "-p", "8080", "--gui"
        ]

        logger.lifecycle("\n=======================================================")
        logger.lifecycle(" 🚀 STARTING AUTOMATED LEYDEN TRAINING RUN")
        logger.lifecycle(" Spawning application in the background...")
        logger.lifecycle("=======================================================\n")

        // 1. Start the application in the background
        def processBuilder = new ProcessBuilder(processArgs)
        processBuilder.directory(outputDir)
        processBuilder.redirectErrorStream(true) // Merge stdout and stderr
        def process = processBuilder.start()

        // Consume the output stream so the OS buffer doesn't hang the process
        Thread.start {
            process.inputStream.eachLine { line ->
                println "[Training App] $line"
            }
        }

        // 2. Poll the application until both Actuator Health AND the GUI are up
        def isUp = false
        def maxTries = 60 // Wait up to 60 seconds for heavy Swing startup

        for (int i = 0; i < maxTries; i++) {
            sleep(1000)
            if (!process.isAlive()) {
                throw new GradleException("Training process died unexpectedly with exit code ${process.exitValue()}")
            }

            try {
                // Check if Spring context is serving HTTP
                def healthCheck = new URL("http://localhost:8080/actuator/health").openConnection()
                healthCheck.setRequestMethod("GET")
                healthCheck.connect()
                println("HEALTHCHECK! ${healthCheck.responseCode}")
                if (healthCheck.responseCode == 200) {
                    // Spring is up. Now check if the GUI is registered!
                    def guiCheck = new URL("http://localhost:8080/api/guis").openConnection()
                    guiCheck.setRequestMethod("GET")
                    guiCheck.connect()
                    println("GUI! ${guiCheck.responseCode}")

                    if (guiCheck.responseCode == 200) {
                        isUp = true
                        logger.lifecycle("\n✅ REST API and GUI are fully initialized! Triggering graceful shutdown...")
                        break
                    }
                }
            } catch (Exception e) {
                // Connection refused, app is still starting up
            }
        }

        if (!isUp) {
            process.destroyForcibly()
            throw new GradleException("Application failed to become healthy on port 8080 within ${maxTries} seconds.")
        }

        // 3. Trigger the Actuator Shutdown
        try {
            def shutdownConn = new URL("http://localhost:8080/actuator/shutdown").openConnection()
            shutdownConn.setRequestMethod("POST")
            shutdownConn.setRequestProperty("Content-Type", "application/json")
            shutdownConn.setDoOutput(true)
            shutdownConn.getInputStream().text
            logger.lifecycle("🛑 Shutdown request accepted. Waiting for JVM to dump AOT cache...")
        } catch (Exception e) {
            logger.warn("⚠️ Shutdown request threw an error (process might be terminating too fast to return a response): ${e.message}")
        }

        // 4. Wait for the JVM to exit and write the app.aot file to disk
        def exitCode = process.waitFor()

        if (exitCode != 0 && exitCode != 143) { // 143 is standard SIGTERM, which is fine
            logger.warn("⚠️ Training process exited with code ${exitCode}. Check the logs above.")
        } else {
            logger.lifecycle("\n🎉 Leyden cache 'app.aot' successfully generated in ${outputDir.absolutePath}!\n")
        }
    }
}

//###################################### AOT post processing END #######################################



application {
    mainClass = mainClassNameGlobal
    applicationDefaultJvmArgs = project.siriusJvmArgs
    executableDir = 'bin'
}


launch4j {
    mainClassName = mainClassNameGlobal
    jarTask = bootJarTask
    jvmOptions = project.siriusJvmArgs as Set
}

//additional GUI win launcher
tasks.register('createGuiExe', Launch4jLibraryTask) {
    outfile = 'sirius-gui.exe'
    fileDescription = 'SIRIUS graphical user interface'
    headerType = "gui"
    cmdLine = "rest -s --gui"
}
createGuiExe.dependsOn 'launch4j'


startScripts {
    applicationName = "sirius"
    defaultJvmOpts = project.siriusJvmArgs

    doLast {
        // writer sh script
        if (!siriusTargetPlatform.isWin()) {
            def templateBinding = [
                    toolName : "SIRIUS",
                    mainClass: mainClassNameGlobal
            ]
            def sf = file("${rootDir}/scripts/sirius.sh.templ")
            templateBinding.shell = "sh"
            templateBinding.classPath = "\\\"\$JAR_HOME/*\\\":\\\"\$GUROBI_HOME/lib/gurobi.jar\\\":\\\"\$CPLEX_HOME/lib/cplex.jar\\\""
            templateBinding.javaLibPath = ""
            templateBinding.gurobiHome = "/lib"
            templateBinding.cplexHome = "/bin/x86-64_linux"
            templateBinding.jvmOpts = "${application.applicationDefaultJvmArgs.stream().collect(Collectors.joining(' '))}"
            templateBinding.javaCommand = "\$APP_HOME/runtime/bin/java"
            templateBinding.jarHome = libDir == null ? "\$APP_HOME/app" : libDir

            String script = sf.text
            templateBinding.forEach({ k, v -> script = script.replace("#$k#", v) })
            unixScript.withWriter { it.write(script) }
            unixScript.setExecutable(true, false)
        } else {
            delete(unixScript)
        }

        if (siriusTargetPlatform.isWin()) {
            //reset binding and create windows bat
            def templateBinding = [
                    toolName : "SIRIUS",
                    mainClass: mainClassNameGlobal
            ]
            // write bat
            def sf = file("${rootDir}/scripts/sirius.bat.templ")
            templateBinding.classPath = "%JAR_HOME%\\*"
            templateBinding.jvmOpts = "${application.applicationDefaultJvmArgs.stream().map({ s -> '"' + s + '"' }).collect(Collectors.joining(" "))}"
            templateBinding.jarHome = libDir == null ? "%APP_HOME%\\app" : libDir
            templateBinding.gurobiJar = "%GUROBI_HOME%\\lib\\gurobi.jar"
            templateBinding.cplexJar = "%CPLEX_HOME%\\lib\\cplex.jar"

            String script = sf.text
            templateBinding.forEach({ k, v -> script = script.replace("#$k#", v) })
            windowsScript.withWriter { it.write(script) }
            windowsScript.setExecutable(true, false)
        } else {
            delete(windowsScript)
        }
    }
}



distributions {
    sirius {
        contents {
            into('app') {
                from(tasks.named('extractForLeyden')){
                    exclude('app.aot')
                }
            }
            if (siriusTargetPlatform.isWin()) {
                from startScripts
                from(layout.buildDirectory.dir("launch4j").get().asFile) {
                    include("*.exe")
                }
                into('ExplorerLicTester') {
                    from("${rootDir}/dist/ExplorerLicTester")
                }
            } else {
                into('bin') {
                    from startScripts
                }
            }
            from("${rootDir}") {
                include('COPYING.txt')
                include('LICENSE.txt')
            }
            from(layout.buildDirectory.dir("reports/dependency-license").get().asFile) {
                include('licenses.md')
            }
            if (includeRuntime) {
                into('runtime') {
                    from {
                        "${parent.tasks.getByName('extractRuntimeImage').outputs.files.singleFile}"
                    }
                }
            }
        }
    }
}

installSiriusDist.dependsOn('extractForLeyden')
siriusDistZip.dependsOn('extractForLeyden')
siriusDistTar.dependsOn('extractForLeyden')

installSiriusDist.dependsOn('generateLicenseReport')
siriusDistZip.dependsOn 'generateLicenseReport'
siriusDistTar.dependsOn 'generateLicenseReport'

if (siriusTargetPlatform.isWin()) {
    installSiriusDist.dependsOn('launch4j')
    siriusDistZip.dependsOn('launch4j')
    siriusDistTar.dependsOn('launch4j')

    installSiriusDist.dependsOn('createGuiExe')
    siriusDistZip.dependsOn('createGuiExe')
    siriusDistTar.dependsOn('createGuiExe')
}


if (includeRuntime) {
    installSiriusDist.dependsOn parent.tasks.named('extractRuntimeImage')
    siriusDistZip.dependsOn parent.tasks.named('extractRuntimeImage')
    siriusDistTar.dependsOn parent.tasks.named('extractRuntimeImage')
}


buildJpDists.dependsOn 'createChecksums'
buildJpDists.dependsOn 'signDistImage'
buildJpDists.dependsOn 'distImageZip'
if (siriusTargetPlatform.isMac()) {
    buildJpDists.dependsOn 'macNotarize'
}
if (!siriusTargetPlatform.isLinux()) {
    buildJpDists.dependsOn 'signDistInstaller'
    buildJpDists.dependsOn 'distInstaller'
}

// OS specific packaging
distImage {
    enabled = true
    dependsOn installSiriusDist
    runtimeImageDirectory = installSiriusDist.outputs.files.singleFile.toPath().resolve("runtime").toFile()
    inputDir = installSiriusDist.outputs.files.singleFile.toPath().resolve("app").toFile()
    imageName = 'sirius'
    mainClass = mainClassNameGlobal
    jvmArgs = application.applicationDefaultJvmArgs
    mainJarName = bootJarTask.flatMap { it.archiveFileName }
    winConsole = true
    macPackageName = 'SIRIUS'
    if (siriusTargetPlatform.isWin()) {
        //HACK additional windows launchers are imported from launch4j, this is just fake to register it for the start menu. must be a valid path but file must not exists
        launchers = ["sirius-gui": "${createGuiExe.outfile}"]
    }
}

distInstaller {
    linuxShortcut = true
}
