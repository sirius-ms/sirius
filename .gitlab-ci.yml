sync_api_to_monorepo:
  stage: sync
  variables:
    MONOREPO_PROJECT_PATH: "bright-giant/sirius/sirius-js-monorepo"
    SIRIUS_MIDDLEWARE_FORCE_GUI_ENDPOINTS: "true"

  script:
    - curl -fsSL https://deb.nodesource.com/setup_current.x | bash -  # latest nodejs
    - apt install nodejs -y
    - cd ..
    - git clone "https://${GITLAB_BG_BOT_USERNAME}:${BG_PUBLIC_PUSH_API_TOKEN}@${CI_SERVER_HOST}/${MONOREPO_PROJECT_PATH}.git"
    - cd ${CI_PROJECT_NAME}

    - ./gradlew generateOpenApiDocsAdvancedEnumsAsString
    - ./gradlew copyOpenApiDocsToMonorepo

    - cd ../$(basename ${MONOREPO_PROJECT_PATH})
    - npm install
    - npx nx run --no-cloud sirius-client:generate

    - git config --global user.name "BG GitLab CI Bot"
    - git config --global user.email "${GITLAB_BG_BOT_USERNAME}@${CI_SERVER_HOST}"

    - git add -A
    - "git commit -m \"Auto: update openapi client ${CI_COMMIT_SHORT_SHA}\""
    - git push

  rules:
    - changes:
        - "sirius_rest_service/openapi-spec-enums-as-ref.json"
        - "sirius_rest_service/openapi-spec-enums-as-string.json"
      when: manual
      allow_failure: true