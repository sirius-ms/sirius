default:
  image: gradle:9.4.1-jdk21
  tags: [$RUNNER_TAGS]
  cache:
    - key:
        files:
          - gradle/wrapper/gradle-wrapper.properties
      paths:
        - .gradle/wrapper/
    - key: gradle-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - gradle-cache-$CI_DEFAULT_BRANCH
      paths:
        - .gradle/caches/

stages:
#  - test-libs
#  - build-publish-libs
  - libs
  - build-app
  - test-app
  - publish-app
  - sync

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Xmx4g -XX:MaxMetaspaceSize=512m"
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle

#before_script:
#  - VSNAP=$(head -2 sirius_cli/src/main/resources/sirius_frontend.build.properties | tail -1 | cut -d '=' -f 2)
#  - echo "Using Gradle user home at $GRADLE_USER_HOME"

build_test_publish_libs:
  stage: libs
  script:
    - |
      echo "===> Running Unit Tests"
      gradle test --stacktrace
    - |
      echo "===> Running Integration Tests (incl. account-state tests on an isolated SIRIUS instance)"
      gradle allIntegrationTests --stacktrace
    - |
      if [[ "$CI_COMMIT_BRANCH" == "master" ||  "$CI_COMMIT_BRANCH" == "stable" ]]; then
         echo "===> Publishing Libraries to Gitlab Registry"
         gradle publishMavenJavaPublicationToGitLabRepository --stacktrace
      fi
    - |
      if [[ "$CI_COMMIT_BRANCH" == "stable" ]]; then
        echo "===> Publishing Sirius SDK Public Gitlab Registry"
       gradle publishMavenJavaPublicationToGitLabPublicRepository --stacktrace
      fi

  artifacts:
    when: on_failure
    reports:
      junit:
        - "**/build/test-results/test/TEST-*.xml"
        - "**/build/test-results/integrationTest/TEST-*.xml"
        - "**/build/test-results/accountIntegrationTest/TEST-*.xml"
